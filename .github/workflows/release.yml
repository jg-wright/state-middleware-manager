name: Release

on:
  push:
    branches: [master]

jobs:
  publish-test:
    permissions:
      contents: read
    uses: ./.github/workflows/pull-request.yml

  publish-npm:
    needs: [publish-test]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PEM }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run build

      - uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          extra_plugins: '@semantic-release/git'

      - env:
          GIT_ACTOR: ${{ github.actor }}
          GIT_ACTOR_ID: ${{ github.actor_id }}
        run: | # shell
          git config --global user.name "$GIT_ACTOR"
          git config --global user.email "${GIT_ACTOR_ID}+${GIT_ACTOR}@users.noreply.github.com"

      - run: | # shell
          git checkout develop
          git merge master
          git push origin develop
